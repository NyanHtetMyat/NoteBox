{% extends "layout.html" %}

{% block script_links %}
  <script src="/static/js/scripts.js"></script>
{% endblock %}

{% block title %}
    Homepage
{% endblock %}


{% block body %}
<!-- Sidebar Toggler Button -->
<div class="d-block d-md-none bg-secondary w-100">
  <button class="btn py-0 px-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#collapisble-sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#e8eaed"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
  </button>
</div>

<!-- Collapisble Sidebar For Small Screens -->
<aside class="offcanvas offcanvas-start" id="collapisble-sidebar">
  <div class="offcanvas-header py-2 bg-dark text-white">
    <h1 class="offcanvas-title">My Notes</h1>
    <button type="button" class="btn-close btn-close-white text-reset" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    <button class="btn-note-create btn btn-outline-secondary w-100 text-start mb-3">Create New Note</button>
    <div class="note-button-list">
      {% for note in user_notes %}
        <button class="btn-note btn btn-outline-secondary w-100 text-start mb-3" data-id="{{ note.id }}"> {{ note.title }} </button>
      {% endfor %}
    </div>
  </div>
</aside>


<div class="row flex-nowrap h-100 w-100">
  <!-- Left sidebar -->
  <aside class="d-none d-md-block col-md-3 col-lg-2 bg-light border-end border-secondary overflow-auto">
    <h3 class="p-3 text-center border-bottom border-secondary">My Notes</h3>
    <button class="btn-note-create btn btn-outline-secondary w-100 text-start my-3">Create New Note</button>
    <div class="note-button-list">
      {% for note in user_notes %}
        <button class="btn-note btn btn-outline-secondary w-100 text-start mb-3" data-id="{{ note.id }}"> {{ note.title }} </button>
      {% endfor %}
    </div>
  </aside>

  <!-- Main content -->
  <section class="col-md-9 col-lg-10 p-4">
    <form id="note-area" action="/save_note">

        <input class="form-control form-control-lg border border-secondary" type="text" id="note-title" placeholder="Enter Note Title">

        <textarea class="form-control border border-secondary" id="note-content" placeholder="Start writing here..."></textarea>

        <div class="d-flex justify-content-end" id="note-area-footer">
          <span class="me-auto">Last Updated: <span  id="note-last-updated">None</span></span>     

          <button class="btn btn-success" id="btn-note-save" type="button" name="save"> Save </button>
          <button class="btn btn-danger" id="btn-note-delete" type="button" name="delete"> Delete </button>
        </div>

    </form>
  </section>

</div>

{% endblock %}
