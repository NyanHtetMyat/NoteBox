<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- These two are Bootstrap links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link href="/static/css/styles.css" rel="stylesheet">

    <!-- This is for extra css links: Currently used by login & register -->
    {% block auth_css %}{% endblock %}

    <!-- This is for script links: Currently used by index.html -->
    {% block script_links %}{% endblock %}

    <title>{% block title %}{% endblock %}</title>

</head>
<body class="vh-100">
    
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand logo" href="/">
                📦 NoteBox
            </a>

            {% if session["user_id"] %}
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            {% else %}
                <ul class="navbar-nav flex-row">
                    <li class="nav-item px-2">
                        <a class="nav-link text-center" href="/login">Sign In</a>
                    </li>

                    <li class="nav-item px-2">
                        <a class="nav-link text-center" href="/register">Sign Up</a>
                    </li>
                </ul>
            {% endif %}

        </div>
    </nav>

    <main class="container-fluid d-flex flex-column flex-md-row justify-content-center align-items-center px-0">
        {% block body %}{% endblock %}
    </main>

</body>
</html>
