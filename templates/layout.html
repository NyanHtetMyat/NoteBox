<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="/static/js/scripts.js"></script>


    <title>{% block title %}{% endblock %}</title>
</head>
<body class="vh-100">
    
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                LOGO
            </a>

            {% if session["user_id"] %}
                <!-- <form class="d-flex">
                    <input class="form-control me-2" type="text" placeholder="Search">
                    <button class="btn btn-primary" type="button">Search</button>
                </form> -->

                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout">Logout</a>
                    </li>
                </ul>
            {% else %}
                <ul class="navbar-nav flex-row">
                    <li class="nav-item px-2">
                        <a class="nav-link text-center" href="/login">Sign In</a>
                    </li>

                    <li class="nav-item px-2">
                        <a class="nav-link text-center" href="/register">Sign Up</a>
                    </li>
                </ul>
            {% endif %}

        </div>
    </nav>

    <main class="container-fluid d-flex flex-column flex-md-row justify-content-center align-items-center px-0">
        {% block body %}{% endblock %}
    </main>

</body>
</html>
